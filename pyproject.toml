[project]
name = "bridgedx"
version = "0.1.0"
description = "EHRShot bridge-diagnosis network analysis (CAI 5155 Project 1, Option A)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "python-louvain>=0.16",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgedx"]

[tool.ruff]
line-length = 100
