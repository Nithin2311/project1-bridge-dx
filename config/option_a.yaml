# Option A — locked parameters (from "Project 1 Ideas proposal.docx", Oct 8 2026).
# Change here, never in code. Every script reads this file.

cohort:
  era: icd10                 # primary cohort = ICD-10 era
  era_start: "2015-10-01"    # hospital switched ICD-9 -> ICD-10
  min_distinct_categories: 5 # patient must have >= 5 distinct 3-char categories
  drop_events_after_death: true
  dedupe_to: [person_id, category]   # collapse 749k duplicate rows before counting anything

nodes:
  level: icd10_3char         # e.g. I10, E11, F41, N18
  min_prevalence: 0.01       # >= 1% of cohort patients
  names_from: concept.csv
  flag_chapters: [R, Z]      # symptom / status codes: flagged in nodes.csv (R/Z sensitivity graph = "full")
  # Main graph excludes whole chapters (decided 2026-10-14, revised after the independent review):
  #   R, Z  symptoms / status: higher modularity, more stable Leiden (ARI 0.61 between main and full partitions)
  #   O     pregnancy: a self-contained module (internal/external edge ratio 4.2) that rewiring nulls cannot
  #         reproduce, so its gateway codes (N93, N92, O36) dominated null-adjusted betweenness; it is also
  #         the bulk of "sex-specific" edges. Kept in the full graph as sensitivity.
  main_graph_excludes_chapters: [R, Z, O]
  # Sex-specific categories (used to separate reproductive/sex-organ structure from the rest in the sex test):
  # ICD-10-CM ranges, inclusive, by 3-char code.
  # inclusive 3-char ranges; a letter in the 3rd position (O9A, Z3A) sorts after the digit 9
  sex_specific_ranges: [[C50, C58], [C60, C63], [D25, D28], [D39, D40], [E28, E29], [N40, N53], [N60, N64], [N70, N98], [O00, O9Z], [Q50, Q56], [Z30, Z3Z]]

edges:
  cooccurrence: same_patient # any time in the era (not same-visit) for the main graph
  min_shared_patients: 10
  test: fisher_exact
  correction: bonferroni
  alpha: 0.05
  min_odds_ratio: 1.2
  weight: phi                # main weight
  weight_check: jaccard
  betweenness_distance: inverse_phi

communities:
  algorithm: leiden          # report louvain too
  # Resolution (RB configuration model; 1.0 = plain modularity). Decided 2026-10-14, revised after review:
  #   1.0: the three target clusters do not exist as modules (cardiometabolic inside a 121-node heart-failure
  #        module, mental health inside a 179-node musculoskeletal module).
  #   2.0: all three explicit, but expels seven high-degree acuity codes (E87, K59, D64, N17, I95, Y83, E86)
  #        into 1-4 node communities, which then top every bridge list by construction.
  #   1.5: all three explicit (DM/HTN/lipids with HF/CKD in a 60-node module, metastatic 24 + haem/transplant 49,
  #        mental health 15), six communities under 5 nodes (E08/E10/E13, dental triple, F90, G51, I95, Q89),
  #        standard Q 0.278 vs 0.246 at 2.0. Caveat: the mental-health module is seed-sensitive (15/44/23 nodes
  #        across seeds, see leiden_seed_stability.csv); cardiometabolic is stable (60/60/62).
  # Main = 1.5; 1.0 and 2.0 reported as sensitivity. Quality values are reported both as the RB quality at
  # this resolution (what Leiden optimises and the null is scored on) and as standard modularity (gamma = 1).
  resolution: 1.5
  resolution_sensitivity: [1.0, 2.0]
  min_community_size_in_tables: 5   # smaller communities grouped as "other" in report tables
  seeds: [0, 1, 2, 3, 4]     # stability check
  null_model:
    kind: degree_preserving_rewire
    n: 100

centrality:
  betweenness: weighted      # distance = 1/phi
  null_percentile: true
  roles: guimera_amaral      # participation coefficient + within-module degree z
  prevalence_residual: true  # degree ~ prevalence, report residuals
  # decided 2026-10-14 after step 5: Guimera-Amaral roles are reported but are uninformative on this graph
  # (density 0.10, 27 modules -> participation median 0.75, one node with within-module z >= 2.5).
  # The bridge question is answered directly: betweenness restricted to shortest paths between two target
  # clusters (nx.betweenness_centrality_subset), plus each node's phi-weight share into each cluster.
  # A target cluster = union of the Leiden communities (main partition) that contain its anchor codes.
  target_clusters:
    cardiometabolic: [E11, I50]   # diabetes/hypertension/lipids module + heart failure/CKD/arrhythmia module
    cancer: [C79, D70]            # metastatic-disease module + hematologic/chemo-toxicity module
    mental_health: [F32]          # depression/anxiety/sleep module
  bridge_top_k: 15
  bridge_null_n: 100              # rewired nulls for the cluster-restricted betweenness (added after review)
  bridge_null_percentile_min: 0.95 # a bridge is reported only if observed >= this share of null values
  # magnitude floor (second review N1): a node also needs a finite null z >= bridge_min_z OR an observed value
  # >= bridge_min_share_of_max of the pair's largest value; otherwise one or two shortest paths "pass" with z undefined
  bridge_min_z: 2.0
  bridge_min_share_of_max: 0.10
  precedence: true                # directed first-date precedence between target clusters (sequential analysis)

subgroups:
  same_node_set: true
  groups:
    sex: [female, male]
    age: {cut: 65, labels: [under65, over65]}
  # Age rule (decided 2026-10-14, both teammates run this):
  #   index_date = earliest condition_start_DATE in the ICD-10 era for that patient (min of first_date in
  #                outputs/patient_category.parquet, i.e. after the post-death drop and the >=5-category filter)
  #   age_at_index = floor(years between person.birth_DATETIME and index_date)   (full birth dates in person.csv, no nulls)
  #   over65 if age_at_index >= 65 else under65   (65 counts as over65)
  #   sex from person.gender_concept_id: 8532 = female, 8507 = male (no other values in the data)
  age_rule:
    index_date: first_icd10_era_dx
    birth_field: birth_DATETIME
    sex_concept_ids: {female: 8532, male: 8507}
  comparison:
    partition: adjusted_rand_index
    connectors: top_k_overlap
    top_k: 20
    edge_test: permutation
    n_permutations: 5000   # was 1000 (proposal); raised 2026-10-14: with 13,421 edges the 1/1001 p floor cannot pass BH-FDR 0.05

figures:
  # decided 2026-10-14: every measure runs on the full kept-edge graph (density 0.13); plots only are sparsified
  sparsify: top_k_per_node      # keep each node's k strongest phi edges for the layout, nothing else
  top_k: 5

sensitivity:
  runs:
    - full_graph                # all 601 nodes incl. R, Z, O chapters
    - resolution_sweep          # Leiden at 1.0 and 2.0
    - icd9_bridged_appendix     # rows before era_start; SNOMED -> category via the EMPIRICAL map learned from
                                # this hospital's own ICD-10-era rows (majority category per SNOMED concept),
                                # vocabulary 'Maps to' only as a single-category fallback. The pure vocabulary
                                # bridge was found to give men pregnancy codes and 12% multi-category rows.
    - in_era_temporal_split     # 2015-10..2018-12 vs 2019-01..end, same node set (temporal comparison)
    - stratify_by_n_categories  # unequal follow-up (power-limited: report non-isolate ARI)
  temporal_split_date: "2019-01-01"
  icd9_min_era_rows_per_concept: 5   # empirical map: a SNOMED concept needs >= this many era rows
  # Vocabulary / ancestor fallbacks may only yield categories that are nodes (nodes.csv) outside the excluded
  # chapters: the raw vocabulary sends ICD-9 263.9 "malnutrition" to O25 (malnutrition in pregnancy) and
  # 300.00 "anxiety state" to R45. Hand map for the most frequent ICD-9 codes the SNOMED route cannot bridge
  # (by ICD-9 source value; applied first; chosen from the ICD-9-CM to ICD-10-CM GEM crosswalk):
  icd9_manual_map:
    "300.00": F41   # anxiety state, unspecified -> other anxiety disorders
    "263.9": E46    # unspecified protein-calorie malnutrition
    "202.80": C85   # other lymphoma, unspecified site -> other/unspecified non-Hodgkin lymphoma
    "204.10": C91   # chronic lymphoid leukaemia -> lymphoid leukaemia
    "425.4": I42    # other primary cardiomyopathies
    "277.00": E84   # cystic fibrosis
    "288.00": D70   # neutropenia
    "V42.81": Z94   # bone marrow transplant status
    "793.19": R91   # abnormal findings on lung imaging

project2:
  index_date_rule: TBD       # must be written down once; both teammates run it. Candidates computed by 09:
  # Eligibility also excludes patients with a target diagnosis in the bridged pre-2015 table (review M6).
  # Caveat for Project 2: communities were learned on the same patients; split patients before building the graph.
  horizons_months: [6, 12]
  index_rule_candidates:
    history_1y: first ICD-10-era diagnosis date + 365 days          # every cohort patient gets an index
    calendar_2019: "2019-01-01"                                     # fixed date; needs >= 1 dx before it
  record_end: last condition_start_DATE of the patient (any era)   # only half the patients have observation_period
  targets: target_clusters from centrality + every main community with >= min_community_size_in_tables nodes
  horizon_months: 6          # fall back to 12 or "any new community" if positives < 150
  censoring: exclude_death_or_record_end_inside_horizon
  min_positives: 150

paths:
  data_env: EHRSHOT_DATA
  data_default: ../FinalProject/data
  cache: .cache/ehrshot.duckdb
  outputs: outputs
